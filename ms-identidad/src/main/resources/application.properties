# =====================================================================
# ms-identidad · Gobiernos Locales Digitales (GLD)
# =====================================================================
spring.application.name=ms-identidad

# Puerto y ruta base del microservicio (coincide con el contrato OpenAPI)
server.port=8081
server.servlet.context-path=/api/v1/identidad

# --- Base de datos (PostgreSQL local, base "gld", esquema propio "identidad") ---
spring.datasource.url=jdbc:postgresql://localhost:5432/gld
spring.datasource.username=postgres
spring.datasource.password=1234

# Flyway crea el esquema "identidad" y aplica los scripts de db/migration
spring.flyway.schemas=identidad
spring.flyway.default-schema=identidad

# El esquema lo controla Flyway; Hibernate no crea ni modifica tablas
spring.jpa.hibernate.ddl-auto=none
spring.jpa.properties.hibernate.default_schema=identidad
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# --- Seguridad ---
# Clave HMAC para firmar los JWT (Base64, 256 bits). Cambiarla fuera del entorno local.
gld.seguridad.jwt.secreto=R0xELXByb3RvdGlwby1jbGF2ZS1kZS1kZXNhcnJvbGxvLTIwMjYtc2VndXJh
gld.seguridad.jwt.minutos-acceso=60
gld.seguridad.jwt.minutos-temporal=10

# Origen del frontend (CORS y enlaces de recuperación)
gld.frontend.url=http://localhost:5173

# Vigencia del enlace de recuperación de contraseña (minutos)
gld.recuperacion.minutos-vigencia=30

# Nombre con el que aparece la cuenta en Microsoft Authenticator
gld.mfa.emisor=GLD Gobierno Digital

# Respuestas de error sin traza interna
server.error.include-stacktrace=never
