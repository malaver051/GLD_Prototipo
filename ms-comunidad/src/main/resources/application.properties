# =====================================================================
# ms-comunidad · Gobiernos Locales Digitales (GLD)
# =====================================================================
spring.application.name=ms-comunidad

server.port=8083
server.servlet.context-path=/api/v1/comunidad

# --- Base de datos: misma base "gld", esquema propio "comunidad" ---
spring.datasource.url=jdbc:postgresql://localhost:5432/gld?currentSchema=comunidad
spring.datasource.username=postgres
spring.datasource.password=1234

spring.flyway.schemas=comunidad
spring.flyway.default-schema=comunidad

spring.jpa.hibernate.ddl-auto=none
spring.jpa.properties.hibernate.default_schema=comunidad
spring.jpa.open-in-view=false

# --- Foto de la incidencia (JPG o PNG, máximo 5 MB) ---
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB
gld.almacenamiento.ruta=almacenamiento

# --- Seguridad: debe ser LA MISMA clave de ms-identidad, que es quien firma los JWT ---
gld.seguridad.jwt.secreto=R0xELXByb3RvdGlwby1jbGF2ZS1kZS1kZXNhcnJvbGxvLTIwMjYtc2VndXJh

# --- Integraciones ---
gld.identidad.url=http://localhost:8081/api/v1/identidad
gld.frontend.url=http://localhost:5173

# Radio máximo (km) desde el centro del municipio para aceptar una ubicación
gld.incidencias.radio-km=40

server.error.include-stacktrace=never
