# =====================================================================
# ms-tramites · Gobiernos Locales Digitales (GLD)
# =====================================================================
spring.application.name=ms-tramites

server.port=8082
server.servlet.context-path=/api/v1/tramites

# --- Base de datos: misma base "gld", esquema propio "tramites" ---
spring.datasource.url=jdbc:postgresql://localhost:5432/gld?currentSchema=tramites
spring.datasource.username=postgres
spring.datasource.password=1234

spring.flyway.schemas=tramites
spring.flyway.default-schema=tramites

spring.jpa.hibernate.ddl-auto=none
spring.jpa.properties.hibernate.default_schema=tramites
spring.jpa.open-in-view=false

# --- Archivos adjuntos (PDF, JPG o PNG) ---
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=40MB
# Carpeta donde se guardan adjuntos y documentos oficiales (simula el almacenamiento de objetos)
gld.almacenamiento.ruta=almacenamiento

# --- Seguridad: debe ser LA MISMA clave que usa ms-identidad para firmar los JWT ---
gld.seguridad.jwt.secreto=R0xELXByb3RvdGlwby1jbGF2ZS1kZS1kZXNhcnJvbGxvLTIwMjYtc2VndXJh

# --- Integraciones ---
# ms-identidad: se consulta para obtener los datos del ciudadano y del funcionario
gld.identidad.url=http://localhost:8081/api/v1/identidad
# Frontend (CORS, enlaces en correos y en el documento oficial)
gld.frontend.url=http://localhost:5173

server.error.include-stacktrace=never
